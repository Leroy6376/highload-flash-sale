name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code formatting
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Audit dependencies
        run: composer audit --locked

      - name: Check Rector suggestions
        run: vendor/bin/rector process --dry-run --no-progress-bar --memory-limit=1G

      - name: Check module dependencies
        run: vendor/bin/deptrac --cache-file=storage/framework/deptrac.cache analyse

      - name: Run tests
        run: php artisan test --compact

  docker-build:
    name: Docker builds
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Prepare Docker environment
        run: cp .env.docker.example .env.docker

      - name: Build development images
        run: make build

      - name: Build production images
        run: make prod-build
