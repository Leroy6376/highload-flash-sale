name: highload-flash-sale

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: app
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:php
    profiles: [fpm]
    depends_on:
      php:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"
  php:
    <<: *app
    profiles: [fpm]
    volumes:
      - laravel-storage:/var/www/storage

  postgres:
    image: postgres:17-alpine
    profiles: [fpm, postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laravel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  laravel-storage:
  postgres-data:
