              schema:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                      - 'about:blank'
                  title:
                    type: string
                    examples:
                      - 'Unprocessable Content'
                  status:
                    type: integer
                    examples:
                      - 422
                  detail:
                    type: string
                    examples:
                      - 'The request contains invalid fields.'
                  instance:
                    type: string
                    examples:
                      - /api/v1/auth/login
                  request_id:
                    type: string
                    examples:
                      - 01JEXAMPLE0000000000000000
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          examples:
                            - 'The email field is required.'
                        pointer:
                          type: string
                          examples:
                            - '#/email'
                    examples:
                      -
                        -
                          detail: 'The email field is required.'
                          pointer: '#/email'
                examples:
                  -
                    type: 'about:blank'
                    title: 'Unprocessable Content'
                    status: 422
                    detail: 'The request contains invalid fields.'
                    instance: /api/v1/auth/login
                    request_id: 01JEXAMPLE0000000000000000
                    errors:
                      -
                        detail: 'The email field is required.'
                        pointer: '#/email'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  examples:
                    - gbailey@example.net
                password:
                  type: string
                  description: ''
                  examples:
                    - '|]|{+-'
                device_name:
                  type:
                    - string
                    - 'null'
                  description: 'Must not be greater than 255 characters.'
                  examples:
