            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                      - 'about:blank'
                  title:
                    type: string
                    examples:
                      - Unauthorized
                  status:
                    type: integer
                    examples:
                      - 401
                  detail:
                    type: string
                    examples:
                      - 'Authentication failed.'
