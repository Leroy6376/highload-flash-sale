                    type: 'about:blank'
                    title: Unauthorized
                    status: 401
                    detail: 'Authentication failed.'
                    instance: /api/v1/auth/me
                    request_id: 01JEXAMPLE0000000000000000
        422:
          description: 'Validation failed.'
