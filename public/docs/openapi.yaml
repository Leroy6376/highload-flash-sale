openapi: 3.1.0
info:
  title: 'Highload Flash Sale API'
  description: 'Документация HTTP API приложения.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080'
tags:
  -
    name: Authentication
    description: ''
  -
    name: Catalog
    description: ''
  -
    name: Orders
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Регистрация покупателя'
      operationId: ''
      description: 'Создаёт customer-пользователя и возвращает Bearer-токен.'
      parameters: []
      responses:
        201:
          description: 'Customer registered.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    examples:
                      - 1|example-access-token
                  token_type:
                    type: string
                    examples:
                      - Bearer
                  expires_at:
                    type: string
                    examples:
                      - '2026-10-12T12:15:00.000000Z'
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        examples:
                          - 1
                      name:
                        type: string
                        examples:
                          - 'Иван Петров'
                      email:
                        type: string
                        examples:
                          - ivan.petrov@example.test
                      roles:
                        type: array
                        items:
                          type: string
                        examples:
                          -
                            - customer
                examples:
                  -
                    token: 1|example-access-token
                    token_type: Bearer
                    expires_at: '2026-10-12T12:15:00.000000Z'
                    user:
                      id: 1
                      name: 'Иван Петров'
                      email: ivan.petrov@example.test
                      roles:
                        - customer
        422:
          description: 'Validation failed.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                      - 'about:blank'
                  title:
                    type: string
                    examples:
                      - 'Unprocessable Content'
                  status:
                    type: integer
                    examples:
                      - 422
                  detail:
                    type: string
                    examples:
                      - 'The request contains invalid fields.'
                  instance:
                    type: string
                    examples:
                      - /api/v1/auth/login
                  request_id:
                    type: string
                    examples:
                      - 01JEXAMPLE0000000000000000
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        detail:
                          type: string
                          examples:
                            - 'The email field is required.'
                        pointer:
                          type: string
                          examples:
                            - '#/email'
                    examples:
                      -
                        -
                          detail: 'The email field is required.'
                          pointer: '#/email'
                examples:
                  -
                    type: 'about:blank'
                    title: 'Unprocessable Content'
                    status: 422
                    detail: 'The request contains invalid fields.'
                    instance: /api/v1/auth/login
                    request_id: 01JEXAMPLE0000000000000000
                    errors:
                      -
                        detail: 'The email field is required.'
                        pointer: '#/email'
        429:
          description: 'Registration rate limit exceeded.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    examples:
                      - 'about:blank'
                  title:
                    type: string
                    examples:
                      - 'Too Many Requests'
                  status:
                    type: integer
                    examples:
                      - 429
                  detail:
                    type: string
                    examples:
                      - 'Too many requests. Please try again later.'
                  instance:
                    type: string
                    examples:
                      - /api/v1/auth/register
                  request_id:
                    type: string
                    examples:
                      - 01JEXAMPLE0000000000000000
                examples:
                  -
                    type: 'about:blank'
                    title: 'Too Many Requests'
                    status: 429
                    detail: 'Too many requests. Please try again later.'
                    instance: /api/v1/auth/register
                    request_id: 01JEXAMPLE0000000000000000
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name:
                  type: string
                  description: 'Название устройства для токена.'
                  examples:
                    - 'iPhone 17'
                email:
                  type: string
                  description: 'Уникальный email покупателя.'
                  examples:
                    - ivan.petrov@example.test
                name:
                  type: string
                  description: 'Имя покупателя.'
                  examples:
                    - 'Иван Петров'
                password:
                  type: string
                  description: 'Пароль длиной не менее 8 символов.'
                  examples:
                    - secret-password
                password_confirmation:
                  type: string
                  description: 'Повтор пароля.'
                  examples:
                    - secret-password
              required:
                - email
                - name
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: Вход
      operationId: ''
      description: 'Возвращает Bearer-токен для существующего пользователя.'
