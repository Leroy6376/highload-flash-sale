services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  scheduler:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      additional_contexts:
        app: service:php
    volumes:
      - laravel-storage:/var/www/storage:ro
